name: Build mod

on:
  push:
    branches:
      - code-server-conch
    paths:
      - 'Dockerfile'
      - 'root/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# One image per mod, tagged with the branch name — the LinuxServer convention, so
# consumers reference ghcr.io/vichzp/docker-mods:code-server-conch.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vichzp/docker-mods:${{ github.ref_name }}
          # Attestations off on purpose. buildx would add annotation-bearing
          # manifests to the manifest list; the LSIO installer strips those before
          # picking a platform, but not emitting them keeps the list to exactly the
          # two platform entries and removes a dependency on that behaviour.
          provenance: false
          sbom: false
